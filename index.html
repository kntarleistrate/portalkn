<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activare Notificări - Portal Concedii</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f1f4f8;
      color: #1f2937;
    }
    .box {
      max-width: 440px;
      margin: 24px auto;
      background: #fff;
      border: 1px solid #dce3ec;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(15, 76, 129, 0.08);
    }
    h1 { font-size: 19px; color: #0f4c81; margin-top: 0; }
    p.hint { font-size: 13px; color: #6b7280; line-height: 1.45; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #dce3ec;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0f4c81;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.45;
    }
    .ok { background: #d4edda; color: #1e7e34; }
    .err { background: #f8d7da; color: #b02a37; }
    .info { background: #e6f0fa; color: #0f4c81; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
</head>
<body>
  <div class="box">
    <h1>Activare Notificări Push</h1>
    <p class="hint">
      Introdu marca ta (ex: pentru Team Leader) și apasă pe buton pentru a activa notificările pe acest telefon și a salva token-ul în foaia <strong>User</strong>.
    </p>

    <label for="marca">Număr Marcă</label>
    <input type="text" id="marca" placeholder="Ex: 1002" autocomplete="off">

    <button type="button" id="btnActiveaza" onclick="activeazaPush()">Activează notificările</button>
    <div id="statusBox" class="status" style="display:none;"></div>
  </div>

  <script>
    const APPS_SCRIPT_EXEC_URL = "https://script.google.com/macros/s/AKfycbzL1I5iWnQqvRUUm2mrM3hNdkjZo7rt2GbNGD8tGrO-zg76ejY6C9OJJV5Sxk8U5Fnd/exec";

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyAqCLKDVuMXVKrENFdUd5eFHxWz3DjUKB0",
      authDomain: "portal-pontaj.firebaseapp.com",
      projectId: "portal-pontaj",
      storageBucket: "portal-pontaj.firebasestorage.app",
      messagingSenderId: "747470842537",
      appId: "1:747470842537:web:a99d4afa51077801c557b8",
      measurementId: "G-8S3LN0R7K0"
    };

    const VAPID_PUBLIC_KEY = "BN2-0vhB_WxYiEFRoyYyolkJ5d_wVSDdkqWyoJTA7LDHPg0VQ9thZHkQ9iw2PZ6Y5vOg9fcIcO5Jr0P_WM3zLYQ";

    function showStatus(text, cls) {
      const el = document.getElementById("statusBox");
      el.className = "status " + cls;
      el.textContent = text;
      el.style.display = "block";
    }

    function getOrCreateDeviceId(marca) {
      const key = "portal_device_id_" + marca;
      let devId = localStorage.getItem(key);
      if (!devId) {
        devId = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : ("dev-" + Date.now() + "-" + Math.random().toString(16).slice(2));
        localStorage.setItem(key, devId);
      }
      return devId;
    }

    async function activeazaPush() {
      const marca = document.getElementById("marca").value.trim();
      if (!marca) {
        showStatus("Te rog introdu numărul de marcă.", "err");
        return;
      }
      if (!APPS_SCRIPT_EXEC_URL || APPS_SCRIPT_EXEC_URL.indexOf("http") !== 0) {
        showStatus("Lipsește URL-ul Web App (/exec) din index.html.", "err");
        return;
      }
      if (!("Notification" in window) || !("serviceWorker" in navigator)) {
        showStatus("Acest browser nu suportă notificări push / Service Worker.", "err");
        return;
      }

      const btn = document.getElementById("btnActiveaza");
      btn.disabled = true;
      showStatus("Se cere permisiunea și se generează token-ul...", "info");

      try {
        const perm = await Notification.requestPermission();
        if (perm !== "granted") {
          btn.disabled = false;
          showStatus("Permisiunea de notificare nu a fost acordată.", "err");
          return;
        }

        const swReg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }

        const messaging = firebase.messaging();
        const token = await messaging.getToken({
          vapidKey: VAPID_PUBLIC_KEY,
          serviceWorkerRegistration: swReg
        });

        if (!token) {
          btn.disabled = false;
          showStatus("Nu s-a putut obține PushToken-ul.", "err");
          return;
        }

        const deviceId = getOrCreateDeviceId(marca);

        await fetch(APPS_SCRIPT_EXEC_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "savePushToken",
            marca: marca,
            deviceId: deviceId,
            pushToken: token
          })
        });

        btn.disabled = false;
        showStatus("Notificările sunt active! Token-ul a fost trimis către foaia User pentru marca " + marca + ".", "ok");
      } catch (err) {
        btn.disabled = false;
        showStatus("Eroare: " + (err && err.message ? err.message : String(err)), "err");
      }
    }
  </script>
</body>
</html>
